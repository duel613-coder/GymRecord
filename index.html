<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ジムログ</title>
<meta name="description" content="日々のジムのトレーニングを記録し、種目ごとの重量とボリュームの推移を確認するアプリ。データは端末内にのみ保存されます。">
<meta name="theme-color" content="#16325E" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1216" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ジムログ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<style>
  :root{
    --bg:#F1F3F6; --surface:#FFFFFF; --surface-2:#E7EAEF; --surface-3:#DDE1E8;
    --ink:#151921; --ink-2:#525A68; --ink-3:#848C9B;
    --line:#D9DDE4; --line-strong:#C3C9D3;
    --accent:#16325E; --accent-ink:#FFFFFF; --accent-soft:#E3EAF8; --accent-line:#B7C7E7;
    --gold:#9E6E10; --gold-soft:#F6EDD8;
    --red:#AE332A;
    --shadow:0 1px 2px rgba(18,26,44,.07), 0 6px 18px -8px rgba(18,26,44,.16);
    --radius:14px;
    --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0F1216; --surface:#181C22; --surface-2:#222731; --surface-3:#2B313B;
      --ink:#EDF0F5; --ink-2:#A2ABB9; --ink-3:#6C7686;
      --line:#2A3039; --line-strong:#3A4250;
      --accent:#7FA8F0; --accent-ink:#0A1020; --accent-soft:#1A2540; --accent-line:#31456E;
      --gold:#D9AB41; --gold-soft:#332A15;
      --red:#E3705F;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px -10px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0F1216; --surface:#181C22; --surface-2:#222731; --surface-3:#2B313B;
    --ink:#EDF0F5; --ink-2:#A2ABB9; --ink-3:#6C7686;
    --line:#2A3039; --line-strong:#3A4250;
    --accent:#7FA8F0; --accent-ink:#0A1020; --accent-soft:#1A2540; --accent-line:#31456E;
    --gold:#D9AB41; --gold-soft:#332A15;
    --red:#E3705F;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px -10px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  [hidden]{display:none !important}
  html{
    padding-top:env(safe-area-inset-top, 0px);
    padding-bottom:env(safe-area-inset-bottom, 0px);
    background:var(--surface);
  }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--font-ui); font-size:15px; line-height:1.6;
    -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
    overscroll-behavior-y:none;
  }
  button{font-family:inherit; color:inherit; cursor:pointer}
  input,select,textarea{font-family:inherit; color:inherit; font-size:16px}
  .num{font-variant-numeric:tabular-nums; font-weight:700; letter-spacing:-.012em}
  .lbl{font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3); font-weight:700}

  #app{height:100%; display:flex; flex-direction:column; overflow:hidden}

  /* ---------- header ---------- */
  .top{flex:none; background:var(--surface); border-bottom:1px solid var(--line); padding:10px 16px 11px;
       display:flex; flex-direction:column; gap:9px}
  .brandrow{display:flex; align-items:center; gap:9px}
  .mark{width:19px; height:19px; flex:none; color:var(--accent)}
  .brand{font-weight:800; font-size:13px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-2)}
  .sync{margin-left:auto; display:flex; align-items:center; gap:5px; font-size:11px; color:var(--ink-3)}
  .dot{width:6px; height:6px; border-radius:50%; background:#2E9E6B; flex:none}
  .dot.wait{background:var(--gold)} .dot.off{background:var(--ink-3)}

  .daterow{display:flex; align-items:center; gap:8px}
  .nav{width:38px; height:38px; flex:none; border:1px solid var(--line-strong); background:var(--surface);
       border-radius:10px; display:grid; place-items:center; font-size:17px; color:var(--ink-2)}
  .nav:disabled{opacity:.34}
  .dateblk{flex:1; min-width:0; text-align:center; line-height:1.25}
  .dateblk .d{font-size:19px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-.01em}
  .dateblk .w{font-size:11px; color:var(--ink-3); margin-top:1px}
  .dateblk .w .sat{color:#3B76C4} .dateblk .w .sun{color:var(--red)}
  .today{flex:none; height:38px; padding:0 12px; border-radius:10px; font-size:12.5px; font-weight:700;
         border:1px solid var(--accent-line); background:var(--accent-soft); color:var(--accent)}
  .today:disabled{opacity:.34}

  main{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:14px 16px 26px}
  .stack{display:flex; flex-direction:column; gap:13px; max-width:680px; margin:0 auto}

  .sum{display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--line);
       border:1px solid var(--line); border-radius:var(--radius); overflow:hidden}
  .sum div{background:var(--surface); padding:9px 8px 10px; text-align:center}
  .sum b{display:block; font-size:21px; font-weight:800; font-variant-numeric:tabular-nums;
         line-height:1.15; margin-top:2px; letter-spacing:-.015em}
  .sum small{font-size:10.5px; color:var(--ink-3); letter-spacing:.04em}
  .sum .u,.stats .u{font-size:11px; color:var(--ink-3); font-weight:500; margin-left:1px; letter-spacing:0}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow)}
  .exhead{display:flex; align-items:flex-start; gap:9px; padding:11px 12px 9px; border-bottom:1px solid var(--line)}
  .exname{flex:1; min-width:0; font-weight:700; font-size:15.5px; line-height:1.35}
  .prev{display:block; font-size:11.5px; font-weight:400; color:var(--ink-3); margin-top:2px}
  .prev b{font-weight:700; color:var(--ink-2); font-variant-numeric:tabular-nums}
  .icbtn{width:30px; height:30px; flex:none; border-radius:8px; border:1px solid transparent; background:transparent;
         color:var(--ink-3); display:grid; place-items:center; font-size:16px}
  .icbtn:active{background:var(--surface-2); color:var(--red)}

  .sets{padding:4px 12px 0}
  .shead,.setrow{display:grid; grid-template-columns:18px 1fr 1fr 26px; gap:7px; align-items:center}
  .shead{padding:5px 0 3px}
  .shead span{font-size:10px; letter-spacing:.1em; color:var(--ink-3); font-weight:700; text-align:center}
  .shead span:first-child{text-align:left}
  .setrow{padding:3px 0}
  .setno{font-size:13px; font-weight:700; color:var(--ink-3); text-align:center; font-variant-numeric:tabular-nums}
  .grp{display:flex; align-items:stretch; border:1px solid var(--line-strong); border-radius:9px;
       overflow:hidden; background:var(--surface)}
  .stp{width:31px; flex:none; border:0; background:var(--surface-2); color:var(--ink-2); font-size:16px;
       line-height:1; display:grid; place-items:center; -webkit-user-select:none; user-select:none}
  .stp:active{background:var(--accent-soft); color:var(--accent)}
  .grp input{flex:1; min-width:0; width:100%; border:0; background:transparent; text-align:center;
             font-weight:700; font-size:16px; font-variant-numeric:tabular-nums; padding:6px 1px; outline:none}
  .grp input:focus{background:var(--accent-soft)}
  .delset{width:26px; height:26px; border:0; background:transparent; color:var(--ink-3); border-radius:7px;
          display:grid; place-items:center; font-size:15px}
  .delset:active{background:var(--surface-2); color:var(--red)}

  .exfoot{display:flex; align-items:center; gap:9px; padding:7px 12px 10px}
  .addset{height:33px; padding:0 13px; border-radius:9px; border:1px dashed var(--line-strong);
          background:transparent; color:var(--ink-2); font-size:12.5px; font-weight:700}
  .addset:active{background:var(--surface-2)}
  .exvol{margin-left:auto; font-size:11.5px; color:var(--ink-3)}
  .exvol b{font-weight:800; font-size:14.5px; color:var(--ink); font-variant-numeric:tabular-nums}
  .pr{display:inline-flex; align-items:center; gap:3px; margin-left:7px; padding:1px 6px; border-radius:5px;
      background:var(--gold-soft); color:var(--gold); font-size:10px; font-weight:800; letter-spacing:.04em}

  .addex{width:100%; padding:13px; border-radius:var(--radius); border:1.5px dashed var(--accent-line);
         background:var(--accent-soft); color:var(--accent); font-weight:700; font-size:14.5px}
  .memo{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:10px 12px 11px}
  .memo textarea{width:100%; border:0; background:transparent; resize:vertical; min-height:44px; outline:none;
                 font-size:15px; line-height:1.55; margin-top:4px; padding:0}

  .empty{text-align:center; padding:34px 18px; color:var(--ink-3)}
  .empty .big{font-size:12px; font-weight:800; letter-spacing:.16em; color:var(--ink-2); margin-bottom:6px}
  .empty p{margin:0; font-size:13px}

  .hday{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
        box-shadow:var(--shadow); overflow:hidden}
  .hhead{display:flex; align-items:center; gap:10px; padding:11px 12px; width:100%; border:0;
         background:transparent; text-align:left}
  .hdate{font-size:16px; font-weight:800; font-variant-numeric:tabular-nums; flex:none}
  .hwd{font-size:11px; color:var(--ink-3); flex:none; margin-left:-4px}
  .hmeta{margin-left:auto; font-size:11.5px; color:var(--ink-3); text-align:right; flex:none}
  .hmeta b{font-weight:800; font-size:14px; color:var(--ink-2); font-variant-numeric:tabular-nums}
  .hbody{border-top:1px solid var(--line); padding:9px 12px 11px; display:flex; flex-direction:column; gap:7px}
  .hex{display:flex; gap:9px; align-items:baseline; font-size:13.5px}
  .hex .n{flex:1; min-width:0}
  .hex .s{font-size:13px; color:var(--ink-2); font-variant-numeric:tabular-nums; flex:none; font-weight:600}
  .hmemo{font-size:12.5px; color:var(--ink-2); background:var(--surface-2); border-radius:9px; padding:7px 9px}
  .hopen{align-self:flex-start; margin-top:2px; height:31px; padding:0 12px; border-radius:8px;
         border:1px solid var(--line-strong); background:transparent; font-size:12px; font-weight:700; color:var(--ink-2)}

  .pick{display:flex; align-items:center; gap:9px; background:var(--surface); border:1px solid var(--line);
        border-radius:var(--radius); padding:9px 11px}
  .pick select{flex:1; min-width:0; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink);
               border-radius:9px; padding:8px 9px; font-size:15px; font-weight:700}
  .stats{display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--line);
         border:1px solid var(--line); border-radius:var(--radius); overflow:hidden}
  .stats div{background:var(--surface); padding:10px 8px 11px; text-align:center}
  .stats b{display:block; font-size:20px; font-weight:800; font-variant-numeric:tabular-nums; margin-top:2px;
           letter-spacing:-.015em}
  .stats small{font-size:10.5px; color:var(--ink-3); letter-spacing:.04em}
  .chart{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
         padding:12px 12px 8px; box-shadow:var(--shadow); position:relative}
  .ctitle{display:flex; align-items:baseline; gap:8px; margin-bottom:9px}
  .ctitle h3{margin:0; font-size:13.5px; font-weight:700}
  .ctitle span{font-size:11px; color:var(--ink-3)}
  .chart svg{display:block; width:100%; height:auto; touch-action:pan-y}
  .tip{position:absolute; pointer-events:none; z-index:5; background:var(--ink); color:var(--bg); border-radius:8px;
       padding:6px 9px; font-size:11.5px; line-height:1.45; white-space:nowrap;
       box-shadow:0 4px 14px rgba(0,0,0,.28); transform:translate(-50%,-112%); opacity:0; transition:opacity .12s}
  .tip b{font-weight:800; font-variant-numeric:tabular-nums}

  .sec{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
       box-shadow:var(--shadow); overflow:hidden}
  .sechd{padding:10px 13px 9px; border-bottom:1px solid var(--line)}
  .row{display:flex; align-items:center; gap:11px; padding:11px 13px; border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .row .t{flex:1; min-width:0; font-size:14px; font-weight:500}
  .row .t small{display:block; font-weight:400; font-size:11.5px; color:var(--ink-3); margin-top:1px}
  .btn{flex:none; height:34px; padding:0 14px; border-radius:9px; border:1px solid var(--line-strong);
       background:var(--surface); font-size:12.5px; font-weight:700; color:var(--ink-2)}
  .btn:active{background:var(--surface-2)}
  .btn.pri{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
  .btn.dan{color:var(--red); border-color:var(--red)}
  .seg{display:flex; flex:none; border:1px solid var(--line-strong); border-radius:9px; overflow:hidden}
  .seg button{border:0; background:var(--surface); padding:8px 11px; font-size:12px; font-weight:700; color:var(--ink-3)}
  .seg button[aria-pressed="true"]{background:var(--accent-soft); color:var(--accent)}
  .note{font-size:12px; color:var(--ink-3); line-height:1.65; padding:0 4px}
  .row a{color:var(--accent); text-underline-offset:2px}
  .row code{background:var(--surface-2); padding:1px 5px; border-radius:4px; font-size:11px;
            font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .warn{background:var(--gold-soft); color:var(--gold); border-radius:var(--radius); padding:10px 12px;
        font-size:12.5px; font-weight:600; line-height:1.55}

  nav{flex:none; display:grid; grid-template-columns:repeat(4,1fr); background:var(--surface);
      border-top:1px solid var(--line)}
  nav button{border:0; background:transparent; padding:7px 2px 8px; display:flex; flex-direction:column;
             align-items:center; gap:2px; color:var(--ink-3); font-size:10.5px; font-weight:700; letter-spacing:.04em}
  nav button svg{width:21px; height:21px}
  nav button[aria-current="true"]{color:var(--accent)}

  .scrim{position:fixed; inset:0; background:rgba(10,14,22,.5); z-index:40; opacity:0; transition:opacity .18s}
  .scrim.show{opacity:1}
  .sheet{position:fixed; left:0; right:0; bottom:0; z-index:41; background:var(--bg); border-radius:18px 18px 0 0;
         max-height:86%; display:flex; flex-direction:column; transform:translateY(100%);
         transition:transform .22s cubic-bezier(.32,.72,0,1);
         padding-bottom:env(safe-area-inset-bottom, 0px); box-shadow:0 -8px 30px rgba(0,0,0,.24)}
  .sheet.show{transform:translateY(0)}
  .shhd{display:flex; align-items:center; gap:10px; padding:13px 16px 10px; flex:none}
  .shhd h2{margin:0; font-size:15.5px; font-weight:700; flex:1}
  .shbody{overflow-y:auto; padding:0 16px 18px; display:flex; flex-direction:column; gap:14px}
  .cat .lbl{margin-bottom:7px; display:block}
  .chips{display:flex; flex-wrap:wrap; gap:7px}
  .chip{padding:8px 12px; border-radius:20px; border:1px solid var(--line-strong); background:var(--surface);
        font-size:13.5px; font-weight:500; line-height:1.3}
  .chip:active,.chip.used{background:var(--accent-soft); border-color:var(--accent-line); color:var(--accent)}
  .chip.used{font-weight:700}
  span.chip.edit{display:inline-flex; align-items:center; gap:7px; padding:5px 5px 5px 12px}
  .chipx{width:24px; height:24px; flex:none; border:0; border-radius:50%; background:var(--red); color:#fff;
         font-size:11px; line-height:1; display:grid; place-items:center}
  .hint{margin:0; font-size:12.5px; line-height:1.6; color:var(--ink-2); background:var(--surface-2);
        border-radius:10px; padding:9px 11px}
  .freeadd{display:flex; gap:8px}
  .freeadd input{flex:1; min-width:0; border:1px solid var(--line-strong); background:var(--surface);
                 border-radius:10px; padding:10px 12px; outline:none}
  .freeadd input:focus{border-color:var(--accent)}
  .freeadd select{flex:none; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink);
                  border-radius:10px; padding:10px 5px; outline:none; font-size:15px; font-weight:700}
  .catsel{flex:none; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink);
          border-radius:9px; padding:7px 4px; font-size:12.5px; font-weight:700; outline:none}
  .chip.genre{display:inline-flex; align-items:center; gap:7px; font-weight:700;
              border-color:var(--accent-line); background:var(--accent-soft); color:var(--accent)}
  .chip.genre .gn{font-size:11px; font-weight:800; font-variant-numeric:tabular-nums; opacity:.75;
                  border-left:1px solid var(--accent-line); padding-left:7px}
  .chip.on{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:700}
  .inline{width:100%; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink);
          border-radius:9px; padding:8px 10px; outline:none; font-size:15px}
  .inline:focus{border-color:var(--accent)}

  .toast{position:fixed; left:50%; bottom:calc(76px + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%);
         background:var(--ink); color:var(--bg); padding:9px 15px; border-radius:20px; font-size:13px;
         font-weight:600; z-index:60; opacity:0; transition:opacity .2s; pointer-events:none; max-width:88%;
         text-align:center}
  .toast.show{opacity:1}
  .updbar{position:fixed; left:12px; right:12px; bottom:calc(74px + env(safe-area-inset-bottom, 0px));
          background:var(--accent); color:var(--accent-ink); border-radius:12px; padding:10px 12px; z-index:55;
          display:flex; align-items:center; gap:10px; font-size:13px; font-weight:600; box-shadow:var(--shadow)}
  .updbar button{border:0; background:rgba(255,255,255,.22); color:inherit; border-radius:8px; padding:7px 12px;
                 font-size:12.5px; font-weight:800; flex:none}

  @media (prefers-reduced-motion: reduce){*,*::before,*::after{transition-duration:.01ms !important}}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brandrow">
      <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" aria-hidden="true">
        <path d="M3 9v6M6 6.5v11M18 6.5v11M21 9v6M6 12h12"/>
      </svg>
      <span class="brand">Gym Log</span>
      <span class="sync" id="sync"><span class="dot"></span><span id="syncTxt">端末に保存</span></span>
    </div>
    <div class="daterow" id="daterow">
      <button class="nav" id="prevDay" aria-label="前の日">‹</button>
      <div class="dateblk"><div class="d" id="dTxt">—</div><div class="w" id="wTxt">—</div></div>
      <button class="nav" id="nextDay" aria-label="次の日">›</button>
      <button class="today" id="todayBtn">今日</button>
    </div>
  </header>

  <main id="main"><div class="stack" id="stack"></div></main>

  <nav id="nav">
    <button data-view="record" aria-current="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9v6M6 6.5v11M18 6.5v11M21 9v6M6 12h12"/></svg>記録
    </button>
    <button data-view="history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9.5h18M8 2.8v3.4M16 2.8v3.4M7.5 13.5h4M7.5 17h7"/></svg>履歴
    </button>
    <button data-view="chart">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 20.5h17M6 20.5V11M11 20.5V6.5M16 20.5v-6M20.5 20.5V9"/></svg>推移
    </button>
    <button data-view="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.6M12 18.6v2.6M21.2 12h-2.6M5.4 12H2.8M18.5 5.5l-1.8 1.8M7.3 16.7l-1.8 1.8M18.5 18.5l-1.8-1.8M7.3 7.3L5.5 5.5"/></svg>設定
    </button>
  </nav>
</div>

<div class="scrim" id="scrim" hidden></div>

  <div class="shhd"><h2 id="sheetTitle">種目を追加</h2><button class="btn" id="sheetEdit" hidden>編集</button><button class="btn" id="sheetClose">閉じる</button></div>

<script>
(function(){
  "use strict";

  /* ===================== 定数 ===================== */
  // 初回起動時にデータとして書き込む「たね」。以降はこの配列を参照せず、
  // 種目はすべて state.exercises（保存データ側）だけで管理する。
  var SEED_EXERCISES = [
    ["胸", ["ベンチプレス","インクラインベンチプレス","ダンベルプレス","チェストプレス","ペックフライ","ケーブルクロスオーバー"]],
    ["背中", ["ラットプルダウン","シーテッドロー","デッドリフト","ベントオーバーロー","チンニング","ワンハンドロー"]],
    ["脚", ["スクワット","レッグプレス","レッグエクステンション","レッグカール","ヒップスラスト","カーフレイズ"]],
    ["肩", ["ショルダープレス","サイドレイズ","リアレイズ","フロントレイズ","アップライトロー","シュラッグ"]],
    ["腕", ["アームカール","インクラインカール","ハンマーカール","ケーブルプレスダウン","フレンチプレス","ディップス"]],
    ["体幹", ["アブドミナルクランチ","トーソローテーション","レッグレイズ","プランク","バックエクステンション"]]
  ];
  var CATS = ["胸","背中","脚","肩","腕","体幹","その他"];
  // ジャンル＝その日のメニュー構成。初回だけ用意し、以降は利用者が自由に編集する
  var DEFAULT_GENRES = [
    ["胸の日", ["ベンチプレス","インクラインベンチプレス","チェストプレス","ペックフライ"]],
    ["背中の日", ["ラットプルダウン","シーテッドロー","ベントオーバーロー"]],
    ["脚の日", ["スクワット","レッグプレス","レッグエクステンション","レッグカール","カーフレイズ"]],
    ["肩の日", ["ショルダープレス","サイドレイズ","リアレイズ","シュラッグ"]],
    ["腕の日", ["アームカール","ハンマーカール","ケーブルプレスダウン","フレンチプレス"]]
  ];
  var WD = ["日","月","火","水","木","金","土"];
  var LS_KEY = "gymlog.state.v1", LS_THEME = "gymlog.theme", LS_DBX = "gymlog.dbx.v1";
  var DB_NAME = "gymlog", DB_STORE = "kv", DB_KEY = "state";

  /* ===================== 状態 ===================== */
  var state = {
    days: {}, exercises: [], exInit: false, genres: [], genresInit: false, lastBackup: 0, savedAt: 0,
    view: "record", date: keyOf(new Date()), chartEx: null, openDays: {},
    sheetEdit: false, sheetMode: "pick", editGenre: -1, lastCat: "その他", exOpen: false
  };
  var idb = null, saveTimer = null, saving = false, localFail = false;
  // Dropbox（設定・トークンは端末内にのみ保存し、コードには一切含めない）
  var dbx = { appKey:"", refreshToken:"", auto:true, verifier:"", lastSync:0, syncedAt:0, lastDated:"" };
  var dbxToken = { access:"", exp:0 };
  var dbxState = "idle";          // idle | syncing | error
  var dbxTimer = null, dbxBusy = false, dbxErr = "";

  /* ===================== ユーティリティ ===================== */
  function keyOf(d){
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }
  function parseKey(k){ var p = k.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
  function shiftDate(k, n){ var d = parseKey(k); d.setDate(d.getDate()+n); return keyOf(d); }
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){
    return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]; }); }
  function round1(n){ return Math.round(n*10)/10; }
  function fmt(n){ return (Math.round(n*10)/10).toLocaleString("ja-JP"); }
  function volOf(day){
    var v = 0;
    (day.entries||[]).forEach(function(e){ (e.sets||[]).forEach(function(s){
      if (s.w > 0 && s.r > 0) v += s.w * s.r; }); });
    return v;
  }
  function setCount(day){
    var n = 0;
    (day.entries||[]).forEach(function(e){ (e.sets||[]).forEach(function(s){
      if (s.w > 0 && s.r > 0) n++; }); });
    return n;
  }
  function e1rm(w, r){ return r > 0 ? w * (1 + r/30) : 0; }
  function dayOf(k){ return state.days[k]; }
  function ensureDay(k){
    if (!state.days[k]) state.days[k] = { entries: [], memo: "", updatedAt: Date.now() };
    return state.days[k];
  }
  function exerciseHistory(name){
    var out = [];
    Object.keys(state.days).sort().forEach(function(k){
      var d = state.days[k], best = 0, vol = 0, top = null;
      (d.entries||[]).forEach(function(e){
        if (e.name !== name) return;
        (e.sets||[]).forEach(function(s){
          if (!(s.w > 0 && s.r > 0)) return;
          vol += s.w * s.r;
          if (s.w > best){ best = s.w; top = s; }
        });
      });
      if (vol > 0) out.push({ date:k, max:best, vol:vol, top:top });
    });
    return out;
  }
  function lastTime(name, beforeKey){
    var hist = exerciseHistory(name).filter(function(h){ return h.date < beforeKey; });
    return hist.length ? hist[hist.length-1] : null;
  }
  function isPR(name, key, w){
    if (!(w > 0)) return false;
    var prior = exerciseHistory(name).filter(function(h){ return h.date < key; });
    var best = 0;
    prior.forEach(function(h){ if (h.max > best) best = h.max; });
    return w > best && prior.length > 0;
  }

  /* ===================== 種目（すべて保存データ側で管理） ===================== */
  function seedList(){
    var out = [];
    SEED_EXERCISES.forEach(function(g){
      g[1].forEach(function(n){ out.push({ name: n, cat: g[0] }); });
    });
    return out;
  }
  // 文字列の配列（旧形式）も {name, cat} も受け取り、重複を除いて正規化する
  function normEx(list){
    var out = [], seen = {};
    (list || []).forEach(function(x){
      var name = null, cat = null;
      if (typeof x === "string") name = x;
      else if (x && typeof x === "object"){ name = x.name; cat = x.cat; }
      if (typeof name !== "string") return;
      name = name.trim();
      if (!name || seen[name]) return;
      seen[name] = 1;
      out.push({ name: name, cat: CATS.indexOf(cat) >= 0 ? cat : "その他" });
    });
    return out;
  }
  function findEx(name){
    for (var i = 0; i < state.exercises.length; i++)
      if (state.exercises[i].name === name) return i;
    return -1;
  }
  function exIn(cat){
    return state.exercises.filter(function(c){ return c.cat === cat; });
  }
  function knownNames(){
    return state.exercises.map(function(c){ return c.name; });
  }
  function usesOf(name){
    var n = 0;
    Object.keys(state.days).forEach(function(k){
      if ((state.days[k].entries||[]).some(function(e){ return e.name === name; })) n++;
    });
    return n;
  }
  function seedExercises(){
    if (state.exInit || state.exercises.length) return false;
    state.exercises = seedList();
    state.exInit = true;
    return true;
  }
  function restoreSeed(){
    var added = 0;
    seedList().forEach(function(c){
      if (findEx(c.name) < 0){ state.exercises.push(c); added++; }
    });
    state.exInit = true;
    persist(); render();
    toast(added ? added + " 種目を戻しました" : "不足している種目はありません");
  }
  function removeExercise(name, after){
    var i = findEx(name);
    if (i < 0) return;
    var n = usesOf(name);
    if (n > 0 && !window.confirm(
        name + " を一覧から削除します。\n過去 " + n + " 日ぶんの記録はそのまま残ります。\nよろしいですか？")) return;
    state.exercises.splice(i, 1);
    persist();
    if (after) after();
    render();
    toast(name + " を一覧から削除しました");
  }

  /* ===================== ジャンル ===================== */
  function normGenres(list){
    var out = [], seen = {};
    (list || []).forEach(function(g){
      if (!g || typeof g !== "object") return;
      var name = typeof g.name === "string" ? g.name.trim() : "";
      if (!name || seen[name]) return;
      seen[name] = 1;
      var items = [], got = {};
      (Array.isArray(g.items) ? g.items : []).forEach(function(n){
        if (typeof n === "string" && n.trim() && !got[n]){ got[n] = 1; items.push(n); }
      });
      out.push({ name: name, items: items });
    });
    return out;
  }
  function findGenre(name){
    for (var i = 0; i < state.genres.length; i++)
      if (state.genres[i].name === name) return i;
    return -1;
  }
  function seedGenres(){
    if (state.genresInit || state.genres.length) return false;
    state.genres = DEFAULT_GENRES.map(function(g){ return { name: g[0], items: g[1].slice() }; });
    state.genresInit = true;
    return true;
  }
  // 当日のシートにすでにあるか
  function hasToday(name){
    var day = dayOf(state.date);
    return !!(day && (day.entries || []).some(function(e){ return e.name === name; }));
  }
  function applyGenre(gi){
    var g = state.genres[gi];
    if (!g) return;
    if (!g.items.length){ toast("「" + g.name + "」に種目が登録されていません"); return; }
    var added = 0, skipped = 0;
    g.items.forEach(function(n){
      if (addExercise(n, null, true)) added++; else skipped++;
    });
    touch(state.date);
    closeSheet();
    render();
    if (!added) toast("「" + g.name + "」の種目はすべて追加済みです");
    else toast("「" + g.name + "」から " + added + " 種目を追加" + (skipped ? "（" + skipped + " 件は追加済み）" : ""));
  }

  /* ===================== 保存：localStorage + IndexedDB ===================== */
  function snapshot(){
    return { days: state.days, exercises: state.exercises, exInit: state.exInit,
             genres: state.genres, genresInit: state.genresInit,
             lastBackup: state.lastBackup, savedAt: Date.now(), version: 2 };
  }
  function openIdb(){
    return new Promise(function(resolve){
      if (!window.indexedDB) return resolve(null);
      var req;
      try{ req = indexedDB.open(DB_NAME, 1); }catch(e){ return resolve(null); }
      req.onupgradeneeded = function(){
        var d = req.result;
        if (!d.objectStoreNames.contains(DB_STORE)) d.createObjectStore(DB_STORE);
      };
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ resolve(null); };
      setTimeout(function(){ resolve(req.result || null); }, 2500);
    });
  }
  function idbGet(){
    return new Promise(function(resolve){
      if (!idb) return resolve(null);
      try{
        var tx = idb.transaction(DB_STORE, "readonly");
        var rq = tx.objectStore(DB_STORE).get(DB_KEY);
        rq.onsuccess = function(){ resolve(rq.result || null); };
        rq.onerror = function(){ resolve(null); };
      }catch(e){ resolve(null); }
    });
  }
  function idbPut(obj){
    return new Promise(function(resolve){
      if (!idb) return resolve(false);
      try{
        var tx = idb.transaction(DB_STORE, "readwrite");
        tx.objectStore(DB_STORE).put(obj, DB_KEY);
        tx.oncomplete = function(){ resolve(true); };
        tx.onerror = function(){ resolve(false); };
      }catch(e){ resolve(false); }
    });
  }
  function persist(){
    var snap = snapshot();
    state.savedAt = snap.savedAt;
    var okLs = false;
    try{ localStorage.setItem(LS_KEY, JSON.stringify(snap)); okLs = true; }catch(e){}
    idbPut(snap).then(function(okDb){
      saving = false;
      localFail = !(okLs || okDb);
      updateStatus();
      dbxSchedule();
    });
  }
  function touch(key){
    if (key) ensureDay(key).updatedAt = Date.now();
    saving = true;
    updateStatus();
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(persist, 400);
  }
  function adopt(obj){
    if (!obj || typeof obj !== "object") return;
    if (obj.days && typeof obj.days === "object") state.days = obj.days;
    if (Array.isArray(obj.exercises)){
      state.exercises = normEx(obj.exercises);
      state.exInit = !!obj.exInit;
    } else if (Array.isArray(obj.custom) || Array.isArray(obj.hidden)){
      // 旧形式：コード側のプリセット − 非表示 ＋ 自分で追加した種目 を、そのままデータへ移す
      var hid = Array.isArray(obj.hidden) ? obj.hidden : [];
      var merged = seedList().filter(function(c){ return hid.indexOf(c.name) < 0; });
      state.exercises = normEx(merged.concat(normEx(obj.custom)));
      state.exInit = true;
    }
    if (Array.isArray(obj.genres)) state.genres = normGenres(obj.genres);
    state.genresInit = !!obj.genresInit;
    state.lastBackup = obj.lastBackup || 0;
    state.savedAt = obj.savedAt || 0;
  }
  async function loadAll(){
    var fromLs = null;
    try{
      var raw = localStorage.getItem(LS_KEY);
      if (raw) fromLs = JSON.parse(raw);
    }catch(e){}
    idb = await openIdb();
    var fromDb = await idbGet();
    var pick = null;
    if (fromLs && fromDb) pick = (fromDb.savedAt||0) >= (fromLs.savedAt||0) ? fromDb : fromLs;
    else pick = fromDb || fromLs;
    adopt(pick);
    var seeded = seedExercises();
    if (seedGenres()) seeded = true;
    // 片方が欠けていれば補う
    if (seeded || (pick && (!fromDb || !fromLs))) persist();
  }

  function setSync(cls, txt){
    var s = document.getElementById("sync");
    if (!s) return;
    s.querySelector(".dot").className = "dot " + cls;
    document.getElementById("syncTxt").textContent = txt;
  }
  function updateStatus(){
    if (localFail) return setSync("off", "保存できません");
    if (saving) return setSync("wait", "保存中");
    if (!dbxOn()) return setSync("", state.savedAt ? "保存済み" : "端末に保存");
    if (dbxState === "syncing") return setSync("wait", "Dropbox 同期中");
    if (dbxState === "error") return setSync("off", "Dropbox 未同期");
    if (dbxDirty()) return setSync("wait", "Dropbox 未同期");
    setSync("", "Dropbox 同期済み");
  }

  /* ===================== Dropbox 自動バックアップ =====================
     PKCE（client secret なし）＋ リダイレクトなしの認証コード方式。
     iOS のホーム画面アプリは外部サイトへのリダイレクトで戻ってこられないため、
     認証コードを手で貼り付ける形にしている。 */
  function dbxLoad(){
    try{
      var o = JSON.parse(localStorage.getItem(LS_DBX) || "null");
      if (o && typeof o === "object"){
        dbx.appKey = String(o.appKey || "");
        dbx.refreshToken = String(o.refreshToken || "");
        dbx.auto = o.auto !== false;
        dbx.verifier = String(o.verifier || "");
        dbx.lastSync = o.lastSync || 0;
        dbx.syncedAt = o.syncedAt || 0;
        dbx.lastDated = String(o.lastDated || "");
      }
    }catch(e){}
  }
  function dbxSave(){ try{ localStorage.setItem(LS_DBX, JSON.stringify(dbx)); }catch(e){} }
  function dbxOn(){ return !!(dbx.appKey && dbx.refreshToken); }
  function dbxDirty(){ return state.savedAt > (dbx.syncedAt || 0); }

  function b64url(buf){
    var b = "", a = new Uint8Array(buf);
    for (var i = 0; i < a.length; i++) b += String.fromCharCode(a[i]);
    return btoa(b).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  function randVerifier(){
    var a = new Uint8Array(64);
    (window.crypto || {}).getRandomValues ? crypto.getRandomValues(a) : a.forEach(function(_, i){ a[i] = (Math.random()*256)|0; });
    return b64url(a.buffer).slice(0, 96);
  }
  async function dbxAuthUrl(){
    dbx.verifier = randVerifier();
    dbxSave();
    var digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(dbx.verifier));
    return "https://www.dropbox.com/oauth2/authorize" +
           "?client_id=" + encodeURIComponent(dbx.appKey) +
           "&response_type=code&token_access_type=offline" +
           "&code_challenge=" + b64url(digest) + "&code_challenge_method=S256";
  }
  function form(obj){
    return Object.keys(obj).map(function(k){
      return encodeURIComponent(k) + "=" + encodeURIComponent(obj[k]);
    }).join("&");
  }
  async function dbxTokenCall(body){
    var res = await fetch("https://api.dropboxapi.com/oauth2/token", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: form(body)
    });
    var txt = await res.text(), data = {};
    try{ data = JSON.parse(txt); }catch(e){}
    if (!res.ok) throw new Error(data.error_description || data.error || ("HTTP " + res.status));
    return data;
  }
  async function dbxConnect(code){
    code = (code || "").trim();
    if (!dbx.appKey){ toast("先に App key を保存してください"); return; }
    if (!code){ toast("認証コードを貼り付けてください"); return; }
    if (!dbx.verifier){ toast("もう一度「認証ページを開く」から始めてください"); return; }
    try{
      var d = await dbxTokenCall({
        code: code, grant_type: "authorization_code",
        client_id: dbx.appKey, code_verifier: dbx.verifier
      });
      if (!d.refresh_token) throw new Error("リフレッシュトークンが返りませんでした");
      dbx.refreshToken = d.refresh_token;
      dbx.verifier = "";
      dbxToken.access = d.access_token || "";
      dbxToken.exp = Date.now() + ((d.expires_in || 14400) - 300) * 1000;
      dbxState = "idle"; dbxErr = "";
      dbxSave(); render(); updateStatus();
      toast("Dropbox に接続しました");
      dbxSync(true);
    }catch(e){
      toast("接続できませんでした：" + e.message);
    }
  }
  async function dbxAccess(){
    if (dbxToken.access && Date.now() < dbxToken.exp) return dbxToken.access;
    var d = await dbxTokenCall({
      grant_type: "refresh_token", refresh_token: dbx.refreshToken, client_id: dbx.appKey
    });
    dbxToken.access = d.access_token;
    dbxToken.exp = Date.now() + ((d.expires_in || 14400) - 300) * 1000;
    return dbxToken.access;
  }
  // Dropbox-API-Arg ヘッダーは ASCII しか通らないため非 ASCII を退避する
  function headerSafe(s){
    return s.replace(/[\u007f-￿]/g, function(c){
      return "\\u" + ("0000" + c.charCodeAt(0).toString(16)).slice(-4);
    });
  }
  async function dbxUpload(path, text){
    var token = await dbxAccess();
    var res = await fetch("https://content.dropboxapi.com/2/files/upload", {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + token,
        "Dropbox-API-Arg": headerSafe(JSON.stringify({
          path: path, mode: "overwrite", autorename: false, mute: true
        })),
        "Content-Type": "application/octet-stream"
      },
      body: new Blob([text], { type: "application/octet-stream" })
    });
    if (!res.ok){
      var t = await res.text();
      throw new Error("HTTP " + res.status + " " + t.slice(0, 160));
    }
  }
  function dbxSchedule(){
    if (!dbxOn() || !dbx.auto || !dbxDirty()) return;
    if (dbxTimer) clearTimeout(dbxTimer);
    dbxTimer = setTimeout(function(){ dbxSync(false); }, 5000);
  }
  async function dbxSync(manual){
    if (!dbxOn()){ if (manual) toast("先に Dropbox に接続してください"); return; }
    if (dbxBusy) return;
    if (!manual && !dbxDirty()) return;
    dbxBusy = true; dbxState = "syncing"; updateStatus();
    var at = state.savedAt;
    try{
      var payload = JSON.stringify({
        app: "gymlog", version: 2, exported: new Date().toISOString(),
        days: state.days, exercises: state.exercises, genres: state.genres
      });
      await dbxUpload("/gymlog-backup.json", payload);
      var d = keyOf(new Date());
      if (dbx.lastDated !== d){
        try{ await dbxUpload("/history/gymlog-" + d + ".json", payload); dbx.lastDated = d; }catch(e){}
      }
      dbx.lastSync = Date.now();
      dbx.syncedAt = at;
      state.lastBackup = dbx.lastSync;
      dbxState = "idle"; dbxErr = "";
      dbxSave(); persistQuiet();
      if (manual) toast("Dropbox に保存しました");
      if (state.view === "settings") render();
    }catch(e){
      dbxState = "error";
      dbxErr = e.message || "不明なエラー";
      if (manual) toast("同期できませんでした：" + dbxErr);
      if (state.view === "settings") render();
    }
    dbxBusy = false;
    updateStatus();
  }
  // 同期結果の記録だけを保存する（savedAt を動かさないので再同期を誘発しない）
  function persistQuiet(){
    var snap = snapshot();
    snap.savedAt = state.savedAt;
    try{ localStorage.setItem(LS_KEY, JSON.stringify(snap)); }catch(e){}
    idbPut(snap);
  }
  function dbxDisconnect(){
    if (!window.confirm("Dropbox との接続を解除します。\nDropbox 上のバックアップは消えません。\nよろしいですか？")) return;
    dbx.refreshToken = ""; dbx.verifier = ""; dbx.lastSync = 0; dbx.syncedAt = 0; dbx.lastDated = "";
    dbxToken = { access:"", exp:0 };
    dbxState = "idle"; dbxErr = "";
    dbxSave(); render(); updateStatus();
    toast("接続を解除しました");
  }

  /* ===================== トースト ===================== */
  var toastTimer = null;
  function toast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 2200);
  }

  /* ===================== 記録 ===================== */
  function viewRecord(){
    var key = state.date, day = dayOf(key), h = "";

    var exs = day ? (day.entries || []).length : 0;

    h += '<div class="sum">' +
         '<div><small>種目</small><b>' + exs + '</b></div>' +
         '<div><small>セット</small><b>' + sets + '</b></div>' +
         '<div><small>総ボリューム</small><b>' + fmt(vol) + '<span class="u">kg</span></b></div></div>';

    if (!day || !day.entries.length){
      h += '<div class="empty"><div class="big">NO SETS YET</div><p>下の「種目を追加」から今日のメニューを組み立てます。</p></div>';
    } else {
      day.entries.forEach(function(en, ei){
        var lt = lastTime(en.name, key), evol = 0, topw = 0;
        (en.sets || []).forEach(function(s){ if (s.w > 0 && s.r > 0){ evol += s.w*s.r; if (s.w > topw) topw = s.w; } });
        var pr = isPR(en.name, key, topw);

        h += '<section class="card" data-e="' + ei + '">';
        h += '<div class="exhead"><div class="exname">' + esc(en.name);
        h += lt
          ? '<span class="prev">前回 ' + esc(lt.date.slice(5).replace("-","/")) + '　<b>' + fmt(lt.max) + 'kg</b> ／ ボリューム <b>' + fmt(lt.vol) + 'kg</b></span>'
          : '<span class="prev">初めての種目</span>';
        h += '</div><button class="icbtn" data-act="delex" aria-label="種目を削除">✕</button></div>';

        h += '<div class="sets"><div class="shead"><span>#</span><span>重量 KG</span><span>回数 REPS</span><span></span></div>';
        (en.sets || []).forEach(function(s, si){
          h += '<div class="setrow" data-s="' + si + '">' +
               '<span class="setno">' + (si+1) + '</span>' +
               '<div class="grp"><button class="stp" data-act="w-" aria-label="重量を減らす">−</button>' +
               '<input id="w-' + ei + '-' + si + '" class="w" inputmode="decimal" value="' + (s.w || "") + '" placeholder="0" aria-label="重量kg">' +
               '<button class="stp" data-act="w+" aria-label="重量を増やす">＋</button></div>' +
               '<div class="grp"><button class="stp" data-act="r-" aria-label="回数を減らす">−</button>' +
               '<input id="r-' + ei + '-' + si + '" class="r" inputmode="numeric" value="' + (s.r || "") + '" placeholder="0" aria-label="回数">' +
               '<button class="stp" data-act="r+" aria-label="回数を増やす">＋</button></div>' +
               '<button class="delset" data-act="delset" aria-label="セットを削除">✕</button></div>';
        });
        h += '</div><div class="exfoot"><button class="addset" data-act="addset">＋ セット</button>' +
             '<span class="exvol">ボリューム <b class="evol">' + fmt(evol) + '</b> kg' +
             (pr ? '<span class="pr">自己ベスト</span>' : '') + '</span></div></section>';
      });
    }

    h += '<button class="addex" id="addEx">＋ 種目を追加</button>';
    h += '<div class="memo"><span class="lbl">メモ（体調・コンディション）</span>' +
         '<textarea id="memo" placeholder="例：睡眠6時間、左肩やや張り。次回はベンチ62.5kgに挑戦。">' +
         esc(day && day.memo ? day.memo : "") + '</textarea></div>';
    return h;
  }

  /* ===================== 履歴 ===================== */
  function viewHistory(){
    var keys = Object.keys(state.days).filter(function(k){
      var d = state.days[k]; return d && d.entries && d.entries.length; }).sort().reverse();

    if (!keys.length)
      return '<div class="empty"><div class="big">NO HISTORY</div><p>記録したトレーニングがここに日付順で並びます。</p></div>';

    var total = 0, totalSets = 0;
    keys.forEach(function(k){ total += volOf(state.days[k]); totalSets += setCount(state.days[k]); });

    var h = '<div class="sum">' +
      '<div><small>トレーニング日数</small><b>' + keys.length + '</b></div>' +
      '<div><small>累計セット</small><b>' + totalSets + '</b></div>' +
      '<div><small>累計ボリューム</small><b>' + fmt(Math.round(total/1000)) + '<span class="u">t</span></b></div></div>';

    keys.forEach(function(k){
      var d = state.days[k], dt = parseKey(k), open = !!state.openDays[k];
      h += '<article class="hday"><button class="hhead" data-act="toggleday" data-k="' + k + '">' +
           '<span class="hdate">' + (dt.getMonth()+1) + '/' + dt.getDate() + '</span>' +
           '<span class="hwd">(' + WD[dt.getDay()] + ')</span>' +
           '<span class="hmeta"><b>' + fmt(volOf(d)) + '</b> kg ・ ' + d.entries.length + '種目 ・ ' + setCount(d) + 'セット</span>' +
           '</button>';
      if (open){
        h += '<div class="hbody">';
        d.entries.forEach(function(en){
          var top = 0, reps = 0;
          (en.sets||[]).forEach(function(s){ if (s.w > 0 && s.r > 0 && s.w >= top){ top = s.w; reps = s.r; } });
          var n = (en.sets||[]).filter(function(s){ return s.w > 0 && s.r > 0; }).length;
          h += '<div class="hex"><span class="n">' + esc(en.name) + '</span><span class="s">' +
               (top ? fmt(top) + 'kg × ' + reps + ' ／ ' + n + 'セット' : '—') + '</span></div>';
        });
        if (d.memo) h += '<div class="hmemo">' + esc(d.memo) + '</div>';
        h += '<button class="hopen" data-act="openday" data-k="' + k + '">この日を編集</button></div>';
      }
      h += '</article>';
    });
    return h;
  }

  /* ===================== 推移 ===================== */
  function viewChart(){
    var names = {}, order = [];
    Object.keys(state.days).forEach(function(k){
      (state.days[k].entries||[]).forEach(function(e){
        var has = (e.sets||[]).some(function(s){ return s.w > 0 && s.r > 0; });
        if (has && !names[e.name]){ names[e.name] = 1; order.push(e.name); }
      });
    });
    order.sort();
    if (!order.length)
      return '<div class="empty"><div class="big">NO DATA</div><p>重量と回数を記録すると、種目ごとの推移グラフが表示されます。</p></div>';
    if (!state.chartEx || order.indexOf(state.chartEx) < 0) state.chartEx = order[0];

    var hist = exerciseHistory(state.chartEx), maxW = 0, bestRm = 0;
    var lastVol = hist.length ? hist[hist.length-1].vol : 0;
    hist.forEach(function(p){
      if (p.max > maxW) maxW = p.max;
      if (p.top){ var r = e1rm(p.top.w, p.top.r); if (r > bestRm) bestRm = r; }
    });

    var h = '<div class="pick"><span class="lbl">種目</span><select id="exSel" aria-label="種目を選択">';
    order.forEach(function(n){
      h += '<option value="' + esc(n) + '"' + (n === state.chartEx ? " selected" : "") + '>' + esc(n) + '</option>';
    });
    h += '</select></div>';
    h += '<div class="stats">' +
         '<div><small>最高重量</small><b>' + fmt(maxW) + '<span class="u">kg</span></b></div>' +
         '<div><small>推定1RM</small><b>' + fmt(Math.round(bestRm)) + '<span class="u">kg</span></b></div>' +
         '<div><small>直近ボリューム</small><b>' + fmt(lastVol) + '<span class="u">kg</span></b></div></div>';
    h += '<div class="chart" id="c1"><div class="ctitle"><h3>最高重量の推移</h3><span>' + hist.length + '回分 ・ kg</span></div>' +
         lineChart(hist) + '<div class="tip" id="tip1"></div></div>';
    h += '<div class="chart" id="c2"><div class="ctitle"><h3>1回あたりの総ボリューム</h3><span>重量 × 回数の合計 ・ kg</span></div>' +
         barChart(hist) + '<div class="tip" id="tip2"></div></div>';
    h += '<p class="note">推定1RM は Epley 式（重量 × (1 + 回数 ÷ 30)）による参考値です。実際に1回挙上できる重量を保証するものではありません。</p>';
    return h;
  }

  function lineChart(hist){
    var W = 320, H = 150, L = 38, R = 10, T = 12, B = 26;
    var iw = W - L - R, ih = H - T - B;
    if (!hist.length) return "";
    var sc = scale(hist.map(function(p){ return p.max; }), ih, T);
    var n = hist.length;
    var x = function(i){ return n === 1 ? L + iw/2 : L + (iw * i)/(n-1); };

    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="最高重量の推移">' + grid(sc, L, W - R);
    var line = "";
    hist.forEach(function(p, i){ line += (i ? "L" : "M") + round1(x(i)) + " " + round1(sc.y(p.max)) + " "; });
    s += '<path d="' + line + 'L' + round1(x(n-1)) + ' ' + (T+ih) + ' L' + round1(x(0)) + ' ' + (T+ih) + ' Z" fill="var(--accent)" fill-opacity="0.10"/>';
    s += '<path d="' + line + '" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    hist.forEach(function(p, i){
      s += '<circle cx="' + round1(x(i)) + '" cy="' + round1(sc.y(p.max)) + '" r="' + (i === n-1 ? 4.6 : 3.2) +
           '" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>';
    });
    var lp = hist[n-1];
    s += '<text x="' + round1(x(n-1)) + '" y="' + round1(sc.y(lp.max) - 10) + '" text-anchor="' + (n === 1 ? "middle" : "end") +
         '" fill="var(--ink)" font-size="11" font-weight="700">' + fmt(lp.max) + '</text>';
    s += xLabels(hist, x, T + ih + 17);
    var slot = iw/Math.max(n-1,1);
    hist.forEach(function(p, i){
      s += '<rect class="hit" data-i="' + i + '" x="' + round1(x(i) - slot/2 - 2) + '" y="' + T +
           '" width="' + round1(slot + 4) + '" height="' + ih + '" fill="transparent"/>';
    });
    return s + '</svg>';
  }

  function barChart(hist){
    var W = 320, H = 150, L = 38, R = 10, T = 12, B = 26;
    var iw = W - L - R, ih = H - T - B;
    if (!hist.length) return "";
    var sc = scale(hist.map(function(p){ return p.vol; }), ih, T, true);
    var n = hist.length, slot = iw / n, bw = Math.min(26, Math.max(6, slot - 6));
    var x = function(i){ return L + slot*i + (slot - bw)/2; };

    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="総ボリュームの推移">' + grid(sc, L, W - R);
    hist.forEach(function(p, i){
      var y = sc.y(p.vol), hgt = Math.max(2, (T + ih) - y);
      s += '<rect x="' + round1(x(i)) + '" y="' + round1(y) + '" width="' + round1(bw) + '" height="' + round1(hgt) +
           '" rx="4" fill="var(--accent)" fill-opacity="' + (i === n-1 ? "1" : "0.42") + '"/>';
    });
    var lp = hist[n-1];
    s += '<text x="' + round1(x(n-1) + bw/2) + '" y="' + round1(sc.y(lp.vol) - 6) +
         '" text-anchor="middle" fill="var(--ink)" font-size="11" font-weight="700">' + fmt(lp.vol) + '</text>';
    s += xLabels(hist, function(i){ return x(i) + bw/2; }, T + ih + 17);
    hist.forEach(function(p, i){
      s += '<rect class="hit" data-i="' + i + '" x="' + round1(L + slot*i) + '" y="' + T +
           '" width="' + round1(slot) + '" height="' + ih + '" fill="transparent"/>';
    });
    return s + '</svg>';
  }

  function scale(vals, ih, T, fromZero){
    var mx = Math.max.apply(null, vals), mn = fromZero ? 0 : Math.min.apply(null, vals);
    if (!fromZero){
      var pad = (mx - mn) || Math.max(mx * 0.1, 2.5);
      mn = Math.max(0, mn - pad * 0.35); mx = mx + pad * 0.3;
    } else { mx = mx * 1.12; }
    if (mx === mn) mx = mn + 1;
    var step = niceStep((mx - mn) / 3);
    var lo = fromZero ? 0 : Math.floor(mn/step)*step, hi = Math.ceil(mx/step)*step;
    if (hi <= lo) hi = lo + step;
    var ticks = [];
    for (var v = lo; v <= hi + 1e-9 && ticks.length < 12; v += step) ticks.push(round1(v));
    return { ticks: ticks, y: function(v){ return T + ih - ((v - lo)/(hi - lo)) * ih; } };
  }
  function niceStep(raw){
    var p = Math.pow(10, Math.floor(Math.log(Math.max(raw, 1e-6))/Math.LN10)), n = raw / p;
    return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
  }
  function grid(sc, x0, x1){
    var s = "";
    sc.ticks.forEach(function(t){
      var y = round1(sc.y(t));
      s += '<line x1="' + x0 + '" y1="' + y + '" x2="' + x1 + '" y2="' + y + '" stroke="var(--line)" stroke-width="1"/>';
      s += '<text x="' + (x0 - 6) + '" y="' + (y + 3.5) + '" text-anchor="end" fill="var(--ink-3)" font-size="9.5">' + fmt(t) + '</text>';
    });
    return s;
  }
  function xLabels(hist, x, y){
    var n = hist.length, every = Math.ceil(n/5), s = "";
    hist.forEach(function(p, i){
      if (i % every !== 0 && i !== n-1) return;
      var d = parseKey(p.date);
      s += '<text x="' + round1(x(i)) + '" y="' + y + '" text-anchor="middle" fill="var(--ink-3)" font-size="9.5">' +
           (d.getMonth()+1) + '/' + d.getDate() + '</text>';
    });
    return s;
  }

  /* ===================== 設定：Dropbox ===================== */
  function whenTxt(ms){
    if (!ms) return "まだ同期していません";
    var d = new Date(ms), diff = Math.floor((Date.now() - ms)/60000);
    var hhmm = String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
    if (diff < 1) return "たった今";
    if (diff < 60) return diff + " 分前（" + hhmm + "）";
    if (keyOf(d) === keyOf(new Date())) return "今日 " + hhmm;
    return (d.getMonth()+1) + "/" + d.getDate() + " " + hhmm;
  }
  function viewDropbox(){
    var h = '<div class="sec"><div class="sechd"><span class="lbl">Dropbox 自動バックアップ</span></div>';

    if (!dbx.appKey){
      h += '<div class="row"><span class="t">まだ設定されていません' +
           '<small>記録を Dropbox のアプリ専用フォルダへ自動で保存できます</small></span></div>' +
           '<div class="row"><span class="t" style="font-size:12px;font-weight:400;color:var(--ink-3);line-height:1.7">' +
           '1. <a href="https://www.dropbox.com/developers/apps" target="_blank" rel="noopener">Dropbox の App Console</a> で Create app<br>' +
           '2. Scoped access →「App folder」→ アプリ名を入力<br>' +
           '3. Permissions タブで <code>files.content.write</code> と <code>files.content.read</code> にチェックして Submit<br>' +
           '4. Settings タブの App key を下に貼り付け</span></div>';
    }
    h += '<div class="row"><span class="t"><input id="dbxKey" class="inline" placeholder="App key" aria-label="Dropbox App key" value="' +
         esc(dbx.appKey) + '"></span><button class="btn' + (dbx.appKey ? "" : " pri") + '" data-act="dbxkey">保存</button></div>';

    if (dbx.appKey && !dbx.refreshToken){
      h += '<div class="row"><span class="t">認証する<small>開いたページで「許可」を押すと認証コードが出ます。コピーして下に貼り付けてください。</small></span>' +
           '<button class="btn pri" data-act="dbxauth">認証ページを開く</button></div>' +
           '<div class="row"><span class="t"><input id="dbxCode" class="inline" placeholder="認証コードを貼り付け" aria-label="認証コード"></span>' +
           '<button class="btn pri" data-act="dbxconnect">接続</button></div>';
    }

    if (dbxOn()){
      var st = dbxState === "syncing" ? "同期中"
             : dbxState === "error" ? "エラー：" + esc(dbxErr)
             : dbxDirty() ? "未同期の変更があります" : "最新の状態です";
      h += '<div class="row"><span class="t">接続済み<small>' + st + '</small></span>' +
           '<button class="btn" data-act="dbxsync">今すぐ同期</button></div>' +
           '<div class="row"><span class="t">最終同期<small>' + whenTxt(dbx.lastSync) +
           '　保存先：アプリ／' + esc("ジムログ") + '／gymlog-backup.json</small></span></div>' +
           '<div class="row"><span class="t">自動で同期<small>記録を変えた数秒後と、アプリを開いたときに送ります</small></span>' +
           '<span class="seg"><button data-act="dbxauto" data-v="1" aria-pressed="' + (dbx.auto === true) + '">する</button>' +
           '<button data-act="dbxauto" data-v="0" aria-pressed="' + (dbx.auto === false) + '">しない</button></span></div>' +
           '<div class="row"><span class="t">接続を解除<small>端末内のトークンを消します。Dropbox 上のファイルは残ります。</small></span>' +
           '<button class="btn dan" data-act="dbxoff">解除</button></div>';
    }

    h += '<div class="row"><span class="t" style="font-size:12px;font-weight:400;color:var(--ink-3)">' +

  /* ===================== テーマ ===================== */
  function getTheme(){
    try{ return localStorage.getItem(LS_THEME) || "auto"; }catch(e){ return "auto"; }
  }
  function applyTheme(v){
    if (v === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", v);
    try{ localStorage.setItem(LS_THEME, v); }catch(e){}
  }

  /* ===================== 描画 ===================== */
  function render(){
    var stack = document.getElementById("stack"), v = state.view;
    stack.innerHTML = v === "record" ? viewRecord()
                    : v === "history" ? viewHistory()
                    : v === "chart" ? viewChart()
                    : viewSettings();
    document.getElementById("daterow").hidden = (v !== "record");
    Array.prototype.forEach.call(document.querySelectorAll("nav button"), function(b){
      b.setAttribute("aria-current", b.dataset.view === v ? "true" : "false");
    });
    renderDate();
    if (v === "chart") bindCharts();
    document.getElementById("main").scrollTop = 0;
  }
  function renderDate(){
    var d = parseKey(state.date), today = keyOf(new Date());
    document.getElementById("dTxt").textContent = (d.getMonth()+1) + "月" + d.getDate() + "日";
    var cls = d.getDay() === 0 ? "sun" : d.getDay() === 6 ? "sat" : "";
    var rel = state.date === today ? "今日" : state.date === shiftDate(today,-1) ? "昨日" : d.getFullYear() + "年";
    document.getElementById("wTxt").innerHTML = '<span class="' + cls + '">' + WD[d.getDay()] + "曜日</span>　" + rel;
    document.getElementById("todayBtn").disabled = (state.date === today);
    document.getElementById("nextDay").disabled = (state.date >= today);
  }
  function refreshTotals(){
    var day = dayOf(state.date);
    if (!day) return;
    var sum = document.querySelectorAll(".sum b");
    if (sum.length === 3){
      sum[0].textContent = day.entries.length;
      sum[1].textContent = setCount(day);
      sum[2].innerHTML = fmt(volOf(day)) + '<span class="u">kg</span>';
    }
    Array.prototype.forEach.call(document.querySelectorAll(".card"), function(card){
      var en = day.entries[+card.dataset.e];
      if (!en) return;
      var v = 0;
      (en.sets||[]).forEach(function(s){ if (s.w > 0 && s.r > 0) v += s.w*s.r; });
      var el = card.querySelector(".evol");
      if (el) el.textContent = fmt(v);
    });
  }

  /* ===================== チャート操作 ===================== */
  function bindCharts(){
    var sel = document.getElementById("exSel");
    if (sel) sel.addEventListener("change", function(){ state.chartEx = sel.value; render(); });
    hookTip("c1", "tip1", function(p){
      var d = parseKey(p.date);
      return (d.getMonth()+1) + "/" + d.getDate() + " ・ 最高 <b>" + fmt(p.max) + "</b> kg" +
             (p.top ? "（" + fmt(p.top.w) + "kg × " + p.top.r + "）" : "");
    });
    hookTip("c2", "tip2", function(p){
      var d = parseKey(p.date);
      return (d.getMonth()+1) + "/" + d.getDate() + " ・ <b>" + fmt(p.vol) + "</b> kg";
    });
  }
  function hookTip(chartId, tipId, fmtFn){
    var box = document.getElementById(chartId);
    if (!box) return;
    var svg = box.querySelector("svg"), tip = document.getElementById(tipId);
    if (!svg || !tip) return;
    var hist = exerciseHistory(state.chartEx);
    function show(ev){
      var t = ev.target.closest ? ev.target.closest(".hit") : null;
      if (!t){ tip.style.opacity = 0; return; }
      var p = hist[+t.dataset.i];
      if (!p) return;
      tip.innerHTML = fmtFn(p);
      var br = box.getBoundingClientRect(), hr = t.getBoundingClientRect();
      var cx = hr.left + hr.width/2 - br.left;
      tip.style.left = Math.max(56, Math.min(br.width - 56, cx)) + "px";
      tip.style.top = (hr.top - br.top + 30) + "px";
      tip.style.opacity = 1;
    }
    svg.addEventListener("pointermove", show);
    svg.addEventListener("pointerdown", show);
    svg.addEventListener("pointerleave", function(){ tip.style.opacity = 0; });
  }

  /* ===================== シート ===================== */
  function openSheet(){
    var day = dayOf(state.date), used = {};
    if (day) day.entries.forEach(function(e){ used[e.name] = 1; });

    if (state.sheetMode === "genre") return openGenreSheet();

    var editing = state.sheetEdit, h = "";

    if (state.genres.length && !editing){
      h += '<div class="cat"><span class="lbl">ジャンル（まとめて追加）</span><div class="chips">';
      state.genres.forEach(function(g, i){
        h += '<button class="chip genre" data-act="usegenre" data-i="' + i + '">' +
             esc(g.name) + '<span class="gn">' + g.items.length + '</span></button>';
      });
      h += '</div></div>';
    }

    if (editing){
      h += '<p class="hint">✕ を押すと一覧から外します。過去の記録は残ります。' +
           'もともと入っている種目は「非表示」になるだけで、設定画面からいつでも戻せます。</p>';
    } else {
      h += '<div class="freeadd"><input id="freeEx" placeholder="種目名を入力して追加" aria-label="種目名">' +
           '<select id="freeCat" aria-label="カテゴリ">' +
             CATS.map(function(c){
               return '<option value="' + c + '"' + (c === state.lastCat ? " selected" : "") + '>' + c + '</option>';
             }).join("") +
           '</select><button class="btn pri" data-act="freeadd">追加</button></div>';
    }

    CATS.forEach(function(cat){
      var list = exIn(cat);
      if (!list.length) return;
      h += '<div class="cat"><span class="lbl">' + cat + '</span><div class="chips">';
      list.forEach(function(c){ h += chipFor(c.name, editing, used); });
      h += '</div></div>';
    });
    document.getElementById("shbody").innerHTML = h;
    document.getElementById("sheetTitle").textContent = "種目を追加";
    document.getElementById("sheetClose").textContent = "閉じる";

    var eb = document.getElementById("sheetEdit");
    eb.hidden = false;
    eb.textContent = editing ? "完了" : "編集";
    showSheet();
  }

  function chipFor(name, editing, used){
    if (editing){
      return '<span class="chip edit">' + esc(name) +
             '<button class="chipx" data-act="rmex" data-n="' + esc(name) +
             '" aria-label="' + esc(name) + ' を一覧から削除">✕</button></span>';
    }
    return '<button class="chip' + (used[name] ? " used" : "") +
           '" data-act="pick" data-n="' + esc(name) + '">' + esc(name) + '</button>';
  }

  /* ジャンルに入れる種目を選ぶモード */
  function openGenreSheet(){
    var g = state.genres[state.editGenre];
    if (!g){ state.sheetMode = "pick"; return openSheet(); }
    var inG = {};
    g.items.forEach(function(n){ inG[n] = 1; });

    var h = '<p class="hint">タップして「' + esc(g.name) + '」に入れる種目を選びます。' +
            '色が付いているものが登録済みです。</p>';
    h += '<div class="freeadd">' +
         '<button class="btn" data-act="rengenre" data-i="' + state.editGenre + '">名前を変更</button>' +
         '<button class="btn dan" data-act="delgenre" data-i="' + state.editGenre + '">このジャンルを削除</button></div>';

    CATS.forEach(function(cat){
      var list = exIn(cat);
      if (!list.length) return;
      h += '<div class="cat"><span class="lbl">' + cat + '</span><div class="chips">';
      list.forEach(function(c){
        h += '<button class="chip' + (inG[c.name] ? " on" : "") + '" data-act="toggleitem" data-n="' + esc(c.name) +
             '" aria-pressed="' + !!inG[c.name] + '">' + esc(c.name) + '</button>';
      });
      h += '</div></div>';
    });

    // 種目一覧から消えた名前も外せるようにしておく
    var known = knownNames(), orphans = g.items.filter(function(n){ return known.indexOf(n) < 0; });
    if (orphans.length){
      h += '<div class="cat"><span class="lbl">一覧にない種目</span><div class="chips">';
      orphans.forEach(function(n){
        h += '<button class="chip on" data-act="toggleitem" data-n="' + esc(n) + '" aria-pressed="true">' + esc(n) + '</button>';
      });
      h += '</div></div>';
    }

    document.getElementById("shbody").innerHTML = h;
    document.getElementById("sheetTitle").textContent = esc(g.name);
    document.getElementById("sheetEdit").hidden = true;
    document.getElementById("sheetClose").textContent = "完了";
    showSheet();
  }

  function showSheet(){
    var sc = document.getElementById("scrim"), sh = document.getElementById("sheet");
    sc.hidden = false; sh.hidden = false;
    requestAnimationFrame(function(){ sc.classList.add("show"); sh.classList.add("show"); });
  }
  function closeSheet(){
    var sc = document.getElementById("scrim"), sh = document.getElementById("sheet");
    state.sheetEdit = false; state.sheetMode = "pick"; state.editGenre = -1;
    sc.classList.remove("show"); sh.classList.remove("show");
    setTimeout(function(){ sc.hidden = true; sh.hidden = true; }, 200);
  }
  // quiet = まとめて追加するときの一括モード（個別のトーストや画面更新を行わない）
  function addExercise(name, cat, quiet){
    name = (name || "").trim();
    if (!name) return false;
    if (hasToday(name)){
      if (!quiet) toast("「" + name + "」は今日すでに追加されています");
      return false;
    }
    var day = ensureDay(state.date), last = lastTime(name, state.date);
    var seed = last && last.top ? { w: last.top.w, r: last.top.r } : { w: 0, r: 0 };
    day.entries.push({ name: name, sets: [ { w: seed.w, r: seed.r } ] });
    if (findEx(name) < 0){
      var c = CATS.indexOf(cat) >= 0 ? cat : "その他";
      state.exercises.push({ name: name, cat: c });
      if (cat) state.lastCat = c;
    }
    if (quiet) return true;
    touch(state.date);
    closeSheet();
    render();
    toast(last ? name + " を追加（前回の重量を反映）" : name + " を追加");
    return true;
  }

  /* ===================== ジャンルの編集 ===================== */
  function editGenre(i){
    if (!state.genres[i]) return;
    state.editGenre = i;
    state.sheetMode = "genre";
    openGenreSheet();
  }
  function createGenre(name){
    name = (name || "").trim();
    if (!name) return;
    if (findGenre(name) >= 0){ toast("「" + name + "」はすでにあります"); return; }
    state.genres.push({ name: name, items: [] });
    state.genresInit = true;
    persist();
    render();
    editGenre(state.genres.length - 1);
  }
  function renameGenre(i){
    var g = state.genres[i];
    if (!g) return;
    var v = null;
    try{ v = window.prompt("ジャンル名を変更します", g.name); }catch(e){ v = null; }
    if (v === null) return;
    v = v.trim();
    if (!v) return;
    var dup = findGenre(v);
    if (dup >= 0 && dup !== i){ toast("「" + v + "」はすでにあります"); return; }
    g.name = v;
    persist();
    render();
    if (state.sheetMode === "genre") openGenreSheet();
    toast("ジャンル名を変更しました");
  }
  function deleteGenre(i){
    var g = state.genres[i];
    if (!g) return;
    if (!window.confirm("ジャンル「" + g.name + "」を削除します。\n記録した内容には影響しません。\nよろしいですか？")) return;
    state.genres.splice(i, 1);
    persist();
    if (state.sheetMode === "genre") closeSheet();
    render();
    toast("「" + g.name + "」を削除しました");
  }

  /* ===================== 書き出し・読み込み ===================== */
  async function saveFile(filename, text, mime, okMsg){
    var blob = new Blob([text], { type: mime });
    // iOS では共有シート経由が最も確実
    try{
      if (navigator.canShare && window.File){
        var file = new File([blob], filename, { type: mime });
        if (navigator.canShare({ files: [file] })){
          await navigator.share({ files: [file], title: filename });
          toast(okMsg);
          return true;
        }
      }
    }catch(e){
      if (e && e.name === "AbortError") return false;
    }
    try{
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      toast(okMsg);
      return true;
    }catch(e2){
      toast("書き出しに失敗しました");
      return false;
    }
  }
  function buildCsv(){
    var rows = [["日付","曜日","種目","セット","重量kg","回数","ボリュームkg","推定1RMkg","メモ"]];
    Object.keys(state.days).sort().forEach(function(k){
      var d = state.days[k], wd = WD[parseKey(k).getDay()];
      (d.entries||[]).forEach(function(en){
        (en.sets||[]).forEach(function(s, i){
          if (!(s.w > 0 && s.r > 0)) return;
          rows.push([k, wd, en.name, i+1, s.w, s.r, round1(s.w*s.r), Math.round(e1rm(s.w, s.r)), d.memo || ""]);
        });
      });
    });
    return "﻿" + rows.map(function(r){
      return r.map(function(c){
        var s = String(c);
        return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
      }).join(",");
    }).join("\r\n");
  }
  function mergeImported(obj){
    var days = obj && obj.days ? obj.days : obj;
    if (!days || typeof days !== "object") return -1;
    var n = 0;
    Object.keys(days).forEach(function(k){
      if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) return;
      var r = days[k], l = state.days[k];
      if (!r || !Array.isArray(r.entries)) return;
      if (!l || (r.updatedAt||0) > (l.updatedAt||0)){ state.days[k] = r; n++; }
    });
    var exIn2 = (obj && Array.isArray(obj.exercises)) ? obj.exercises
              : (obj && Array.isArray(obj.custom)) ? obj.custom : null;
    if (exIn2){
      normEx(exIn2).forEach(function(c){ if (findEx(c.name) < 0) state.exercises.push(c); });
      state.exInit = true;
    }
    if (obj && Array.isArray(obj.genres)){
      normGenres(obj.genres).forEach(function(g){ if (findGenre(g.name) < 0) state.genres.push(g); });
      state.genresInit = true;
    }
    return n;
  }

  /* ===================== イベント ===================== */
  document.getElementById("nav").addEventListener("click", function(ev){
    var b = ev.target.closest("button[data-view]");
    if (!b) return;
    state.view = b.dataset.view;
    render();
  });
  document.getElementById("prevDay").addEventListener("click", function(){ state.date = shiftDate(state.date, -1); render(); });
  document.getElementById("nextDay").addEventListener("click", function(){
    if (state.date >= keyOf(new Date())) return;
    state.date = shiftDate(state.date, 1); render();
  });
  document.getElementById("todayBtn").addEventListener("click", function(){ state.date = keyOf(new Date()); render(); });
  document.getElementById("sheetClose").addEventListener("click", closeSheet);
  document.getElementById("scrim").addEventListener("click", closeSheet);

  document.getElementById("sheetEdit").addEventListener("click", function(){
    state.sheetEdit = !state.sheetEdit;
    openSheet();
  });
  function freeCat(){
    var s = document.getElementById("freeCat");
    return s ? s.value : "その他";
  }
  document.getElementById("shbody").addEventListener("click", function(ev){
    var b = ev.target.closest("button[data-act]");
    if (!b) return;
    var act = b.dataset.act;
    if (act === "pick") addExercise(b.dataset.n);
    else if (act === "freeadd") addExercise(document.getElementById("freeEx").value, freeCat());
    else if (act === "rmex") removeExercise(b.dataset.n, openSheet);
    else if (act === "usegenre") applyGenre(+b.dataset.i);
    else if (act === "rengenre") renameGenre(+b.dataset.i);
    else if (act === "delgenre") deleteGenre(+b.dataset.i);
    else if (act === "toggleitem"){
      var g = state.genres[state.editGenre];
      if (!g) return;
      var n = b.dataset.n, i = g.items.indexOf(n);
      if (i >= 0){ g.items.splice(i, 1); b.classList.remove("on"); b.setAttribute("aria-pressed","false"); }
      else { g.items.push(n); b.classList.add("on"); b.setAttribute("aria-pressed","true"); }
      persist();
    }
  });
  document.getElementById("shbody").addEventListener("keydown", function(ev){
    if (ev.key === "Enter" && ev.target.id === "freeEx"){
      ev.preventDefault();
      addExercise(ev.target.value, freeCat());
    }
  });

  document.getElementById("fileIn").addEventListener("change", function(ev){
    var f = ev.target.files && ev.target.files[0];
    if (!f) return;
    var rd = new FileReader();
    rd.onload = function(){
      var obj;
      try{ obj = JSON.parse(rd.result); }catch(e){ toast("JSON を読み取れませんでした"); return; }
      var n = mergeImported(obj);
      if (n < 0){ toast("形式が違うようです"); return; }
      persist(); render();
      toast(n + " 日ぶんを取り込みました");
    };
    rd.readAsText(f);
    ev.target.value = "";
  });

  var stackEl = document.getElementById("stack");

  stackEl.addEventListener("click", function(ev){
    var b = ev.target.closest("[data-act]");
    if (b){
      var act = b.dataset.act;
      var card = b.closest(".card"), row = b.closest(".setrow");
      var ei = card ? +card.dataset.e : -1, si = row ? +row.dataset.s : -1;
      var day = dayOf(state.date);

      if (act === "w+" || act === "w-" || act === "r+" || act === "r-"){
        var input = row.querySelector(act.charAt(0) === "w" ? ".w" : ".r");
        var cur = parseFloat(input.value) || 0;
        var step = act.charAt(0) === "w" ? 2.5 : 1;
        var next = Math.max(0, round1(cur + (act.charAt(1) === "+" ? step : -step)));
        input.value = next || "";
        commitSet(ei, si, act.charAt(0), next);
        return;
      }
      if (act === "addset"){
        var en = day.entries[ei], lastSet = en.sets[en.sets.length-1] || { w:0, r:0 };
        en.sets.push({ w: lastSet.w, r: lastSet.r });
        touch(state.date); render(); return;
      }
      if (act === "delset"){
        var e2 = day.entries[ei];
        e2.sets.splice(si, 1);
        if (!e2.sets.length) e2.sets.push({ w:0, r:0 });
        touch(state.date); render(); return;
      }
      if (act === "delex"){
        var nm = day.entries[ei].name;
        day.entries.splice(ei, 1);
        touch(state.date); render(); toast(nm + " を削除しました"); return;
      }
      if (act === "toggleday"){ state.openDays[b.dataset.k] = !state.openDays[b.dataset.k]; render(); return; }
      if (act === "openday"){ state.date = b.dataset.k; state.view = "record"; render(); return; }
      if (act === "csv"){
        saveFile("gymlog_" + keyOf(new Date()) + ".csv", buildCsv(), "text/csv;charset=utf-8", "CSV を書き出しました");
        return;
      }
      if (act === "json"){
        var payload = JSON.stringify({ app:"gymlog", version:2, exported:new Date().toISOString(),
                                       days:state.days, exercises:state.exercises,
                                       genres:state.genres }, null, 2);
        saveFile("gymlog_backup_" + keyOf(new Date()) + ".json", payload, "application/json",
                 "バックアップを書き出しました").then(function(ok){
          if (ok){ state.lastBackup = Date.now(); persist(); render(); }
        });
        return;
      }
      if (act === "import"){ document.getElementById("fileIn").click(); return; }
      if (act === "theme"){ applyTheme(b.dataset.v); render(); return; }
      if (act === "delcustom"){ removeExercise(b.dataset.n); return; }
      if (act === "toggleexlist"){ state.exOpen = !state.exOpen; render(); return; }
      if (act === "restoreseed"){ restoreSeed(); return; }
      if (act === "dbxkey"){
        var ki = document.getElementById("dbxKey");
        dbx.appKey = (ki ? ki.value : "").trim();
        dbxSave(); render();
        toast(dbx.appKey ? "App key を保存しました" : "App key を消去しました");
        return;
      }
      if (act === "dbxauth"){
        dbxAuthUrl().then(function(url){
          var a = document.createElement("a");
          a.href = url; a.target = "_blank"; a.rel = "noopener";
          document.body.appendChild(a); a.click(); a.remove();
        }).catch(function(){ toast("認証ページを開けませんでした"); });
        return;
      }
      if (act === "dbxconnect"){
        var ci = document.getElementById("dbxCode");
        dbxConnect(ci ? ci.value : "");
        return;
      }
      if (act === "dbxsync"){ dbxSync(true); return; }
      if (act === "dbxauto"){
        dbx.auto = b.dataset.v === "1";
        dbxSave(); render();
        if (dbx.auto) dbxSchedule();
        return;
      }
      if (act === "dbxoff"){ dbxDisconnect(); return; }
      if (act === "setcat") return;   // change イベントで処理
      if (act === "editgenre"){ editGenre(+b.dataset.i); return; }
      if (act === "delgenre"){ deleteGenre(+b.dataset.i); return; }
      if (act === "addgenre"){
        var gi = document.getElementById("newGenre");
        createGenre(gi ? gi.value : "");
        return;
      }
      if (act === "wipe"){
        if (!window.confirm("すべての記録を削除します。取り消せません。続けますか？")) return;
        if (!window.confirm("本当に削除しますか？バックアップは取ってありますか？")) return;
        state.days = {}; state.lastBackup = 0; state.openDays = {};
        persist(); render(); toast("すべての記録を削除しました"); return;
      }
    }
    if (ev.target.id === "addEx") openSheet();
  });

  stackEl.addEventListener("input", function(ev){
    var t = ev.target;
    if (t.id === "memo"){ ensureDay(state.date).memo = t.value; touch(state.date); return; }
    if (t.classList.contains("w") || t.classList.contains("r")){
      var row = t.closest(".setrow"), card = t.closest(".card");
      if (!row || !card) return;
      var val = parseFloat(t.value);
      if (isNaN(val) || val < 0) val = 0;
      if (t.classList.contains("r")) val = Math.round(val);
      commitSet(+card.dataset.e, +row.dataset.s, t.classList.contains("w") ? "w" : "r", val);
    }
  });

  stackEl.addEventListener("keydown", function(ev){
    if (ev.key === "Enter" && ev.target.id === "newGenre"){
      ev.preventDefault();
      createGenre(ev.target.value);
    }
  });

  stackEl.addEventListener("change", function(ev){
    var t = ev.target;
    if (!t.classList || !t.classList.contains("catsel")) return;
    var i = findEx(t.dataset.n);
    if (i < 0) return;
    state.exercises[i].cat = t.value;
    state.lastCat = t.value;
    persist();
    render();
    toast(t.dataset.n + " を「" + t.value + "」に移動しました");
  });

  function commitSet(ei, si, field, val){
    var day = ensureDay(state.date), en = day.entries[ei];
    if (!en || !en.sets[si]) return;
    en.sets[si][field] = val;
    touch(state.date);
    refreshTotals();
  }

  // 日付をまたいだままアプリを開き直したときに今日へ戻す
  document.addEventListener("visibilitychange", function(){
    if (document.visibilityState !== "visible") return;
    var t = keyOf(new Date());
    if (state.view === "record" && state.date !== t && !dayOf(state.date)) { state.date = t; render(); }
    if (dbxOn() && dbx.auto && dbxDirty()) dbxSync(false);
  });

  /* ===================== Service Worker ===================== */
  function initSw(){
    if (!("serviceWorker" in navigator)) return;
    navigator.serviceWorker.register("sw.js").then(function(reg){
      function offer(w){
        if (!w) return;
        document.getElementById("updbar").hidden = false;
        document.getElementById("updBtn").onclick = function(){
          w.postMessage({ type:"SKIP_WAITING" });
        };
      }
      if (reg.waiting) offer(reg.waiting);
      reg.addEventListener("updatefound", function(){
        var nw = reg.installing;
        if (!nw) return;
        nw.addEventListener("statechange", function(){
          if (nw.state === "installed" && navigator.serviceWorker.controller) offer(nw);
        });
      });
    }).catch(function(){});
    var reloaded = false;
    navigator.serviceWorker.addEventListener("controllerchange", function(){
      if (reloaded) return;
      reloaded = true;
      location.reload();
    });
  }

  /* ===================== 起動 ===================== */
  applyTheme(getTheme());
  dbxLoad();
  loadAll().then(function(){
    render();
    updateStatus();
    initSw();
    if (dbxOn() && dbx.auto && dbxDirty()) setTimeout(function(){ dbxSync(false); }, 2500);
    window.addEventListener("online", function(){
      if (dbxOn() && dbx.auto && dbxDirty()) dbxSync(false);
    });
  }).catch(function(){
    render();
    initSw();
  });
})();
</script>
</body>
</html>
